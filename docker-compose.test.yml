services:
  db:
    restart: "no"
    # Postgres creates its user from these on first start. The tests skip
    # `.env.local` (dotenv-flow's test mode) and connect with `.env`'s
    # credentials, so a personal override here would fail their auth.
    env_file: !override
      - packages/db/.env
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    ports: !override
      - "15432:5432"

  redis-sessions:
    volumes: !reset []
    tmpfs:
      - /data
    ports: !override
      - "16379:6379"

  redis-queue:
    volumes: !reset []
    tmpfs:
      - /data
    ports: !override
      - "16380:6379"

  redis-cache:
    tmpfs:
      - /data
    ports: !override
      - "16381:6379"
