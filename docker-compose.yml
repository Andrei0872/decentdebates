name: decentdebates

# Settings shared by the containerized (backend) services.
x-app: &app
  environment: &app-environment
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_SESSIONS_URL: redis://redis-sessions:6379
    REDIS_QUEUE_URL: redis://redis-queue:6379
    REDIS_CACHE_URL: redis://redis-cache:6379
    OTEL_SDK_DISABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENVIRONMENT:-prod-local}
  # Above the apps' shutdown budget (15s close + 5s telemetry flush).
  stop_grace_period: 25s
  # The collector's filelog receiver reads these labels from each log line's
  # `attrs` to set the same resource attributes the OTel SDK puts on metrics
  # and traces.
  logging:
    driver: json-file
    options:
      labels: service.name,service.version,deployment.environment
      max-size: 10m
      max-file: "3"
  depends_on:
    db:
      condition: service_healthy
    redis-sessions:
      condition: service_healthy
    redis-queue:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    otel-collector:
      condition: service_started
      required: false
    migrate:
      condition: service_completed_successfully
  networks:
    - decent_debates_dev

# Same order as dotenv-flow: the gitignored `.env.local` overrides the
# committed `.env`.
x-db-env-file: &db-env-file
  - packages/db/.env
  - path: packages/db/.env.local
    required: false

x-app-labels: &app-labels
  service.version: ${GIT_SHA:-unknown}
  deployment.environment: ${DEPLOYMENT_ENVIRONMENT:-prod-local}

x-redis: &redis
  image: redis:7.0.5
  networks:
    - decent_debates_dev
  healthcheck:
    test: "redis-cli ping"
    interval: 1s
    retries: 20

x-o11y: &o11y
  profiles: [o11y]
  networks:
    - decent_debates_dev

services:

  db:
    image: postgres:13.6
    env_file: *db-env-file
    restart: on-failure
    healthcheck:
      test: "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 1s
      retries: 20
    volumes:
      - database_decent_debates_dev:/var/lib/postgresql/data
    networks:
      - decent_debates_dev
    ports:
      - "5432:5432"

  # Sessions all carry a TTL, so when full, `volatile-lru` logs out the
  # longest-idle users instead of rejecting new logins.
  redis-sessions:
    <<: *redis
    command: >-
      redis-server
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_sessions_decent_debates_dev:/data
    ports:
      - "6379:6379"

  # BullMQ requires `noeviction`: evicting any of a queue's keys corrupts it.
  redis-queue:
    <<: *redis
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_queue_decent_debates_dev:/data
    ports:
      - "6380:6379"

  # Every key can be rebuilt from Postgres, so no persistence.
  redis-cache:
    <<: *redis
    command: >-
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6381:6379"

  # Runs pending migrations once per `up`, then exits; the app services wait
  # for it to succeed.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    image: decentdebates-migrate:local
    env_file: *db-env-file
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - decent_debates_dev

  api:
    <<: *app
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: decentdebates-api:local
    labels:
      <<: *app-labels
      service.name: api
    env_file:
      - packages/db/.env
      - path: packages/db/.env.local
        required: false
      - apps/api/.env
      - path: apps/api/.env.local
        required: false
    environment:
      <<: *app-environment
      # Served over plain HTTP, where express-session silently refuses to set
      # a `Secure` cookie.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "3001:3001" # HTTP
      - "3002:3002" # WebSocket (ReviewGateway)

  notification-worker:
    <<: *app
    profiles: [app]
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: decentdebates-notification-worker:local
    labels:
      <<: *app-labels
      service.name: notification-worker
    env_file: *db-env-file

  otel-collector:
    <<: *o11y
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0"
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-prod-local}
    volumes:
      - ./infra/o11y/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # On Docker Desktop this resolves inside its Linux VM, not on the macOS host.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel_collector_storage:/var/lib/otelcol/file_storage
    ports:
      # For apps run on the host (`start:prod:local` with OTEL_SDK_DISABLED=false).
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    <<: *o11y
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-otlp-receiver
    volumes:
      - ./infra/o11y/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: "wget -q --spider http://localhost:9090/-/ready"
      interval: 5s
      retries: 20
    ports:
      - "9090:9090"

  loki:
    <<: *o11y
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/o11y/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    <<: *o11y
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/o11y/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    <<: *o11y
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/o11y/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/o11y/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: "wget -q --spider http://localhost:3000/api/health"
      interval: 5s
      retries: 20
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      # 3000 is the Next.js client.
      - "3030:3000"

  postgres-exporter:
    <<: *o11y
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    env_file: *db-env-file
    entrypoint:
      - /bin/sh
      - -c
      - >-
        DATA_SOURCE_URI="db:5432/$${POSTGRES_DB}?sslmode=disable"
        DATA_SOURCE_USER="$${POSTGRES_USER}"
        DATA_SOURCE_PASS="$${POSTGRES_PASSWORD}"
        exec /bin/postgres_exporter
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    <<: *o11y
    image: oliver006/redis_exporter:v1.93.0
    # Targets come from the collector's scrape config (`/scrape?target=`).
    depends_on:
      redis-sessions:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  # On Docker Desktop, node-exporter and cadvisor see its Linux VM, not the
  # macOS host.
  node-exporter:
    <<: *o11y
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

  cadvisor:
    <<: *o11y
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      # The default (1s) is far finer than the 15s scrape.
      - --housekeeping_interval=15s
      # Per-CPU, scheduler, TCP/UDP and similar series multiply cardinality
      # and aren't on any dashboard.
      - --disable_metrics=percpu,sched,tcp,udp,process,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,memory_numa
      # Keeps only the compose labels instead of one series label per
      # container label.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # Might need this to quickly generate a UML.
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: foo@bar.com
  #     PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PASSWORD}"
  #   ports:
  #     - "3003:80"
  #   volumes:
  #     - database_decent_debates_pgadmin:/var/lib/pgadmin
  #   networks:
  #     - decent_debates_dev

volumes:
  database_decent_debates_dev:
  redis_sessions_decent_debates_dev:
  redis_queue_decent_debates_dev:
  otel_collector_storage:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  # database_decent_debates_pgadmin:

networks:
  decent_debates_dev:
