# Settings shared by the containerized (backend) services.
x-app: &app
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - decent_debates_dev

services:

  db:
    image: postgres:13.6
    env_file:
      - packages/db/.env
    restart: on-failure
    healthcheck:
      test: "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 1s
      retries: 20
    volumes:
      - database_decent_debates_dev:/var/lib/postgresql/data
      - ./packages/db:/docker-entrypoint-initdb.d/
    networks:
      - decent_debates_dev
    ports:
      - "5432:5432"

  redis:
    image: redis:7.0.5
    networks:
      - decent_debates_dev
    healthcheck:
      test: "redis-cli ping"
      interval: 1s
      retries: 20
    ports:
      - "6379:6379"

  api:
    <<: *app
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: decentdebates-api:local
    env_file:
      - packages/db/.env
      - apps/api/.env
    ports:
      - "3001:3001" # HTTP
      - "3002:3002" # WebSocket (ReviewGateway)

  notification-worker:
    <<: *app
    profiles: [app]
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    image: decentdebates-notification-worker:local
    env_file:
      - packages/db/.env

  # Might need this to quickly generate a UML.
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: foo@bar.com
  #     PGADMIN_DEFAULT_PASSWORD: "${POSTGRES_PASSWORD}"
  #   ports:
  #     - "3003:80"
  #   volumes:
  #     - database_decent_debates_pgadmin:/var/lib/pgadmin
  #   networks:
  #     - decent_debates_dev

volumes:
  database_decent_debates_dev:
  # database_decent_debates_pgadmin:

networks:
  decent_debates_dev:
